INHERIT: mkdocs.shared.yml

site_name: Bijux
site_description: Unified public hub for Bijux systems, documentation, software, and learning programs.
site_author: Bijan Mousavi <bijan@bijux.io>
site_url: !ENV [SITE_URL, https://bijux.io/]
repo_name: bijux/bijux.github.io
repo_url: https://github.com/bijux/bijux.github.io
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: artifacts/docs/site
watch:
  - docs
  - docs/assets
  - docs/overrides
  - .bijux/shared/bijux-docs
  - mkdocs.yml
  - mkdocs.shared.yml

theme:
  custom_dir: docs/overrides

extra:
  bijux:
    repository: bijux
    nav_mode: default
    theme_key: bijux:theme
plugins:
  - search
  - autorefs
  - redirects:
      redirect_maps:
        01-platform/applied-domains/index.md: platform/applied-domains/index.md
        01-platform/delivery-surfaces/index.md: platform/delivery-surfaces/index.md
        01-platform/documentation-network/index.md: platform/documentation-network/index.md
        01-platform/index.md: platform/index.md
        01-platform/operational-assurance/index.md: platform/operational-assurance/index.md
        01-platform/publication-integrity/index.md: platform/publication-integrity/index.md
        01-platform/security-model/index.md: platform/security-model/index.md
        01-platform/system-map/index.md: platform/system-map/index.md
        01-platform/work-qualities/index.md: platform/work-qualities/index.md
        02-bijux-iac/governance-model/index.md: infrastructure/governance-model/index.md
        02-bijux-iac/index.md: infrastructure/index.md
        02-bijux-iac/repository-coverage/index.md: infrastructure/repository-coverage/index.md
        03-bijux-std/index.md: standards/index.md
        03-bijux-std/promotion-model/index.md: standards/promotion-model/index.md
        03-bijux-std/shared-surfaces/index.md: standards/shared-surfaces/index.md
        04-projects/bijux-atlas/index.md: projects/bijux-atlas/index.md
        04-projects/bijux-canon/index.md: projects/bijux-canon/index.md
        04-projects/bijux-core/index.md: projects/bijux-core/index.md
        04-projects/bijux-gnss/index.md: projects/bijux-gnss/index.md
        04-projects/bijux-phylogenetics/index.md: projects/bijux-phylogenetics/index.md
        04-projects/bijux-pollenomics/index.md: projects/bijux-pollenomics/index.md
        04-projects/bijux-proteomics/index.md: projects/bijux-proteomics/index.md
        04-projects/index.md: projects/index.md
        05-learning/index.md: learning/index.md
        05-learning/python-programming/index.md: learning/python-programming/index.md
        05-learning/reproducible-research/index.md: learning/reproducible-research/index.md

nav:
  - Home:
      - Overview: index.md
  - Platform:
      - Overview: platform/index.md
      - Work Qualities: platform/work-qualities/index.md
      - System Map: platform/system-map/index.md
      - Delivery Surfaces: platform/delivery-surfaces/index.md
      - Operational Assurance: platform/operational-assurance/index.md
      - Security Model: platform/security-model/index.md
      - Publication Integrity: platform/publication-integrity/index.md
      - Applied Domains: platform/applied-domains/index.md
      - Documentation Network: platform/documentation-network/index.md
  - Bijux Infrastructure-as-Code:
      - Overview: infrastructure/index.md
      - Governance Model: infrastructure/governance-model/index.md
      - Repository Coverage: infrastructure/repository-coverage/index.md
  - Bijux Standards:
      - Overview: standards/index.md
      - Promotion Model: standards/promotion-model/index.md
      - Shared Surfaces: standards/shared-surfaces/index.md
  - Projects:
      - Overview: projects/index.md
      - Bijux Core: projects/bijux-core/index.md
      - Bijux Canon: projects/bijux-canon/index.md
      - Bijux Atlas: projects/bijux-atlas/index.md
      - Bijux GNSS: projects/bijux-gnss/index.md
      - Bijux Proteomics: projects/bijux-proteomics/index.md
      - Bijux Pollenomics: projects/bijux-pollenomics/index.md
      - Bijux Phylogenetics: projects/bijux-phylogenetics/index.md
  - Learning:
      - Overview: learning/index.md
      - Reproducible Research: learning/reproducible-research/index.md
      - Python Programming: learning/python-programming/index.md
exclude_docs: |
  /overrides/
  /hooks/
  /assets/styles/README.md
  /assets/javascripts/shell/README.md
hooks:
  - configs/docs/publish_site_assets.py
